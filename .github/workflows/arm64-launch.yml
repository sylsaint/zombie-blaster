name: Arm64 launch

# v0.1.1 launch-crash investigation. Does not publish a GitHub Release.
# Published scenarios install the v0.1.0 and v0.1.1 Release APKs as uploaded.
# Control scenarios install separate arm64 packages built by this workflow.
# The emulator is arm64-v8a on an Apple Silicon runner. GitHub-hosted macOS
# has no nested HVF. Emulator 37.2.12 still initializes HVF when -accel off
# is set, then exits HV_UNSUPPORTED. The boot timeout is short so that
# failure is the log, not an hour of adb retries. This is not an Adreno run.

on:
  pull_request:
    paths:
      - ".github/workflows/arm64-launch.yml"
      - "tools/arm64_launch_smoke.sh"
      - "tools/release/export_launch_variants.sh"
      - "scripts/level_host.gd"
      - "scripts/campaign_flow.gd"
      - "docs/tech/release.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-launch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  variants:
    name: Arm64 control APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set Godot cache path
        run: |
          echo "GODOT_CACHE=$RUNNER_TEMP/godot-release-cache" >> "$GITHUB_ENV"
          echo "ARTIFACT_TAG=v0.1.1-controls" >> "$GITHUB_ENV"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if ! sdkmanager --install "platform-tools" "build-tools;36.0.0"; then
            sdkmanager --install "platform-tools" "build-tools;35.0.0"
          fi

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-release-cache
          key: godot-${{ hashFiles('tools/godot.version') }}-${{ runner.os }}-editor-templates-v1

      - name: Export arm64 launch-crash controls
        run: ./tools/release/export_launch_variants.sh

      - name: Upload control APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-variants
          path: build/launch-variants/*.apk
          if-no-files-found: error

  published:
    name: Published APK API ${{ matrix.api }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      EMULATOR_API: ${{ matrix.api }}
      LAUNCH_MODE: published
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download published release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/releases
          gh release download v0.1.1 --repo "${{ github.repository }}" \
            --pattern 'zombie-blaster-v0.1.1-android-release.apk' \
            --dir dist/releases --clobber
          gh release download v0.1.0 --repo "${{ github.repository }}" \
            --pattern 'zombie-blaster-v0.1.0-android-release.apk' \
            --dir dist/releases --clobber

      - name: Boot arm64 emulator and launch the published APKs
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 180
          # Custom options replace the action defaults, so -no-window stays here.
          # -accel off does not stop emulator 37.2.12 from calling HVF on this runner.
          emulator-options: -no-window -gpu host -accel off -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./tools/arm64_launch_smoke.sh

      - name: Upload published-APK logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-published-api-${{ matrix.api }}
          path: build/arm64-launch/**
          if-no-files-found: warn

  controls:
    name: Control APK API ${{ matrix.api }}
    needs: variants
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      EMULATOR_API: ${{ matrix.api }}
      LAUNCH_MODE: variants
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download control APKs
        uses: actions/download-artifact@v4
        with:
          name: android-launch-variants
          path: dist/variants

      - name: Boot arm64 emulator and launch the control APKs
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu host -accel off -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./tools/arm64_launch_smoke.sh

      - name: Upload control logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-controls-api-${{ matrix.api }}
          path: build/arm64-launch/**
          if-no-files-found: warn
