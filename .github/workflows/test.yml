name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ hashFiles('tools/godot.version') }}-linux-x86_64

      - name: Install Godot
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < tools/godot.version)"
          mkdir -p "${{ runner.temp }}/godot"
          if [[ ! -x "${{ runner.temp }}/godot/godot" ]]; then
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip"
            unzip -q -o /tmp/godot.zip -d "${{ runner.temp }}/godot"
            mv "${{ runner.temp }}/godot/Godot_v${version}-stable_linux.x86_64" \
              "${{ runner.temp }}/godot/godot"
            chmod +x "${{ runner.temp }}/godot/godot"
          fi
          echo "GODOT=${{ runner.temp }}/godot/godot" >> "$GITHUB_ENV"

      - name: Import project
        run: "$GODOT" --headless --path . --import

      - name: Smoke main scene
        run: ./tools/smoke_main.sh

      - name: Run GUT
        run: ./tools/run_tests.sh
