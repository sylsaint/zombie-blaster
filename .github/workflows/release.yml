name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "export_presets.cfg"
      - "tools/release/**"
      - "tools/smoke_exported_menu.sh"
      - "tools/emulator_menu_smoke.sh"
      - "docs/tech/release.md"
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: "Filename tag. This run uploads artifacts only and does not publish a GitHub Release."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set Godot cache path
        env:
          INPUT_TAG: ${{ github.event.inputs.artifact_tag || '' }}
        run: |
          echo "GODOT_CACHE=$RUNNER_TEMP/godot-release-cache" >> "$GITHUB_ENV"
          echo "ARTIFACT_TAG=${INPUT_TAG}" >> "$GITHUB_ENV"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          # cmdline-tools 16 dropped the obsolete "tools" package. The action
          # default still installs it, which fails the job before export.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if ! sdkmanager --install "platform-tools" "build-tools;36.0.0"; then
            sdkmanager --install "platform-tools" "build-tools;35.0.0"
          fi

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-release-cache
          key: godot-${{ hashFiles('tools/godot.version') }}-${{ runner.os }}-editor-templates-v1

      - name: Export release and debug APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./tools/release/export_android.sh

      - name: Boot the exported pack and check the menu
        run: ./tools/smoke_exported_menu.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/release/*.apk
          if-no-files-found: error

      - name: Upload profile APK
        uses: actions/upload-artifact@v4
        with:
          name: android-profile-apk
          path: build/profile/*.apk
          if-no-files-found: error

      - name: Upload emulator smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-apk
          path: build/smoke/*.apk
          if-no-files-found: error

  emulator:
    name: Android emulator
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -w /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm

      - name: Download emulator smoke APK
        uses: actions/download-artifact@v4
        with:
          name: android-emulator-apk
          path: dist

      - name: Boot emulator and check the x86_64 smoke menu
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          # SwiftShader GLES cannot link Godot's canvas shader. swangle links it
          # and still does not present canvas pixels to screencap, even when the
          # APK is x86_64-native. The color check stays strict. The smoke script
          # restarts if the first launch dies on CONFIG_ASSETS_PATHS.
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./tools/emulator_menu_smoke.sh

      - name: Upload emulator screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: |
            build/emulator/*.png
            build/emulator/*.txt
          if-no-files-found: error

  ios:
    name: iOS
    # Pull requests only need the Android APK artifacts. Tags and manual runs still export iOS.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set Godot cache path
        env:
          INPUT_TAG: ${{ github.event.inputs.artifact_tag || '' }}
        run: |
          echo "GODOT_CACHE=$RUNNER_TEMP/godot-release-cache" >> "$GITHUB_ENV"
          echo "ARTIFACT_TAG=${INPUT_TAG}" >> "$GITHUB_ENV"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-release-cache
          key: godot-${{ hashFiles('tools/godot.version') }}-${{ runner.os }}-editor-templates-v1

      - name: Export Xcode project or IPA
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: ./tools/release/export_ios.sh

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: |
            build/release/*.ipa
            build/release/*.zip
          if-no-files-found: error

  publish:
    name: GitHub Release
    # always() so a failed or skipped iOS job still publishes the APKs.
    # Tag pushes only: pull_request and workflow_dispatch must not create a Release.
    # android-profile-apk and android-emulator-apk are separate artifacts and are not downloaded here.
    if: always() && needs.android.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-apks
          path: dist
          merge-multiple: true

      - name: Download iOS package if that job succeeded
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: ios-package
          path: dist
          merge-multiple: true

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.ipa
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
